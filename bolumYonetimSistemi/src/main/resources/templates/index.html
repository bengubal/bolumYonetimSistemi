<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ders Programı</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Ders Programı</h1>
        <a href="/dersProgrami/dersEkle" class="btn btn-primary mt-3">Ders Programı Ekle</a>
        <table class="table mt-3">
            <thead>
                <tr>
                    <th>Gün</th>
                    <th>Ders</th>
                    <th>Öğretim Üyesi</th>
                    <th>Derslik</th>
                    <th>Başlangıç Saati</th>
                    <th>Bitiş Saati</th>
                    <th>İşlemler</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="dersProgrami : ${dersProgramlari}">
                    <td th:text="${dersProgrami.gun}">Pazartesi</td>
                    <td th:text="${dersProgrami.ders.dersAdi}">Ders Adı</td>
                    <td th:text="${dersProgrami.ogretimUyesi.isim}">Öğretim Üyesi</td>
                    <td th:text="${dersProgrami.derslik.isim}">Derslik</td>
                    <td th:text="${dersProgrami.baslangicSaati}">10:00</td>
                    <td th:text="${dersProgrami.bitisSaati}">12:00</td>
                    <td>
                        <a th:href="@{/dersDuzenle/{id}(id=${dersProgrami.id})}" class="btn btn-warning btn-sm">Düzenle</a>
                        <a th:href="@{/dersSil/{id}(id=${dersProgrami.id})}" class="btn btn-danger btn-sm">Sil</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
