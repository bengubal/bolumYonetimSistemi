<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sınav Oturma Düzeni - Matris Görünümü</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .classroom-matrix {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .desk {
            width: 80px;
            height: 60px;
            margin: 5px;
            border: 2px solid #6c757d;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            text-align: center;
            position: relative;
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            transition: all 0.3s ease;
        }
        
        .desk.occupied {
            background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
            border-color: #17a2b8;
            color: #0c5460;
        }
        
        .desk.empty {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-color: #adb5bd;
            color: #6c757d;
        }
        
        .desk:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .student-name {
            font-weight: bold;
            font-size: 9px;
            line-height: 1.1;
        }
        
        .student-no {
            font-size: 8px;
            color: #6c757d;
        }
        
        .blackboard {
            background: #2d3436;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid;
        }
        
        .info-panel {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-left: 4px solid #007bff;
            padding: 20px;
            border-radius: 0 10px 10px 0;
        }
        
        @media print {
            .no-print {
                display: none !important;
            }
            
            .classroom-matrix {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <!-- Header -->
        <div class="row no-print">
            <div class="col-12">
                <div class="info-panel mb-4">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h2 class="mb-1">
                                <i class="fas fa-th text-primary"></i> 
                                Matris Görünümü
                            </h2>
                            <p class="mb-0 text-muted">
                                <strong th:text="${oturmaDuzeni.sinavAdi}"></strong> - 
                                <span th:text="${oturmaDuzeni.derslikAdi}"></span>
                            </p>
                        </div>
                        <div class="col-md-4 text-end">
                            <span class="badge fs-6" 
                                  th:classappend="${oturmaDuzeni.durum == 'ONAYLANDI'} ? 'bg-success' : 'bg-warning'"
                                  th:text="${oturmaDuzeni.durum}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sınav Bilgileri -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-3">
                                <div class="border-end">
                                    <h6 class="text-muted mb-1">Sınav Tarihi</h6>
                                    <p class="mb-0 fw-bold" th:text="${#temporals.format(oturmaDuzeni.sinavTarihi, 'dd.MM.yyyy HH:mm')}"></p>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="border-end">
                                    <h6 class="text-muted mb-1">Derslik</h6>
                                    <p class="mb-0 fw-bold" th:text="${derslik.isim}"></p>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="border-end">
                                    <h6 class="text-muted mb-1">Kapasite</h6>
                                    <p class="mb-0 fw-bold" th:text="${derslik.kapasite}"></p>
                                </div>
                            </div>
                            <div class="col-3">
                                <h6 class="text-muted mb-1">Katılan</h6>
                                <p class="mb-0 fw-bold text-primary" th:text="${#lists.size(oturmaDuzeni.oturmaPozisyonlari)}"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h6 class="text-muted mb-2">Gözetmenler</h6>
                        <p class="mb-0" th:text="${oturmaDuzeni.gozetmenler}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Matris Görünümü -->
        <div class="row">
            <div class="col-12">
                <div class="text-center">
                    <!-- Tahta -->
                    <div class="blackboard">
                        <i class="fas fa-chalkboard"></i> TAHTA
                    </div>

                    <!-- Derslik Matrisi -->
                    <div class="classroom-matrix">
                        <div th:each="satir, satirStat : ${matris}" class="d-flex justify-content-center">
                            <div th:each="hucre, hucreStat : ${satir}" 
                                 th:class="${hucre != null and hucre != ''} ? 'desk occupied' : 'desk empty'">
                                <div th:if="${hucre != null and hucre != ''}" class="student-name" th:text="${hucre}"></div>
                                <div th:if="${hucre == null or hucre == ''}" class="text-muted">
                                    <i class="fas fa-chair"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Açıklama -->
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-box occupied" style="background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%); border-color: #17a2b8;"></div>
                            <span>Dolu</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-box empty" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); border-color: #adb5bd;"></div>
                            <span>Boş</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Öğrenci Listesi -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5><i class="fas fa-list"></i> Öğrenci Sıra Listesi</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div th:each="ogrenciOturma, stat : ${oturmaDuzeni.oturmaPozisyonlari}" class="col-md-6 col-lg-4 mb-2">
                                <div class="d-flex align-items-center p-2 border rounded">
                                    <div class="me-3">
                                        <span class="badge bg-primary" th:text="${ogrenciOturma.siraNo}"></span>
                                    </div>
                                    <div class="flex-grow-1">
                                        <div class="fw-bold" th:text="${ogrenciOturma.ogrenciAdi}"></div>
                                        <small class="text-muted" th:text="${ogrenciOturma.ogrenciNo}"></small>
                                    </div>
                                    <div class="text-end">
                                        <small class="text-muted">
                                            <span th:text="${ogrenciOturma.satir}"></span>-<span th:text="${ogrenciOturma.sutun}"></span>
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Butonlar -->
        <div class="row mt-4 no-print">
            <div class="col-12 text-center">
                <div class="btn-group">
                    <a th:href="@{/sinav-oturma/{id}(id=${oturmaDuzeni.id})}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Detaya Dön
                    </a>
                    <button onclick="window.print()" class="btn btn-primary">
                        <i class="fas fa-print"></i> Yazdır
                    </button>
                    <a th:href="@{/sinav-oturma/{id}/pdf(id=${oturmaDuzeni.id})}" class="btn btn-success">
                        <i class="fas fa-file-pdf"></i> PDF İndir
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
