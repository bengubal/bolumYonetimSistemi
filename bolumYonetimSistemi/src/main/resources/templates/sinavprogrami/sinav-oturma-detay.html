<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sınav Oturma Düzeni Detayları</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">

            <!-- Başarı/Hata Mesajları -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Header Card -->
            <div class="card info-card mb-4">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h2 class="mb-0">
                                <i class="fas fa-chair text-primary"></i>
                                <span th:text="${oturmaDuzeni.sinavAdi}"></span>
                            </h2>
                            <p class="text-muted mb-0">Sınav Oturma Düzeni Detayları</p>
                        </div>
                        <div class="col-md-4 text-end">
                            <span class="badge status-badge"
                                  th:classappend="${oturmaDuzeni.durum == 'ONAYLANDI'} ? 'bg-success' : 'bg-warning'"
                                  th:text="${oturmaDuzeni.durum}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- Sol Panel -->
                <div class="col-lg-4">
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5><i class="fas fa-info-circle"></i> Genel Bilgiler</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold"><i class="fas fa-graduation-cap"></i> Sınav Adı</label>
                                <p class="form-control-plaintext" th:text="${oturmaDuzeni.sinavAdi}"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold"><i class="fas fa-calendar-alt"></i> Sınav Tarihi</label>
                                <p class="form-control-plaintext" th:text="${#temporals.format(oturmaDuzeni.sinavTarihi, 'dd MMMM yyyy, HH:mm')}"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold"><i class="fas fa-door-open"></i> Derslik</label>
                                <p class="form-control-plaintext" th:text="${oturmaDuzeni.derslikAdi}"></p>
                                <small class="text-muted" th:if="${derslik != null and derslik.kapasite != null}">
                                    Kapasite: <span th:text="${derslik.kapasite}"></span> kişi
                                </small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold"><i class="fas fa-user-tie"></i> Gözetmenler</label>
                                <p class="form-control-plaintext" th:text="${oturmaDuzeni.gozetmenler}"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold"><i class="fas fa-users"></i> Toplam Öğrenci</label>
                                <p class="form-control-plaintext">
                                    <span class="badge bg-info fs-6" th:text="'Öğrenci Sayısı: ' + ${#lists.size(oturmaDuzeni.ogrenciler)}"></span>
                                </p>
                            </div>
                            <div>
                                <label class="form-label fw-bold"><i class="fas fa-clock"></i> Oluşturulma Tarihi</label>
                                <p class="form-control-plaintext" th:text="${#temporals.format(oturmaDuzeni.olusturmaTarihi, 'dd.MM.yyyy HH:mm')}"></p>
                            </div>
                        </div>
                    </div>

                    <!-- İşlem Butonları -->
                    <div class="card">
                        <div class="card-header bg-secondary text-white">
                            <h6><i class="fas fa-cogs"></i> İşlemler</h6>
                        </div>
                        <div class="card-body">
                            <div class="d-grid gap-2">
                                <a th:href="@{/sinav-oturma/{id}/matris(id=${oturmaDuzeni.id})}" class="btn btn-info">
                                    <i class="fas fa-th"></i> Matris Görünümü
                                </a>
                                <a th:href="@{/sinav-oturma/{id}/pdf(id=${oturmaDuzeni.id})}" class="btn btn-secondary">
                                    <i class="fas fa-file-pdf"></i> PDF Rapor
                                </a>
                                <form th:if="${oturmaDuzeni.durum != 'ONAYLANDI'}"
                                      th:action="@{/sinav-oturma/{id}/onayla(id=${oturmaDuzeni.id})}"
                                      method="post">
                                    <button type="submit" class="btn btn-success w-100"
                                            onclick="return confirm('Bu oturma düzenini onaylamak istediğinizden emin misiniz?')">
                                        <i class="fas fa-check"></i> Onayla
                                    </button>
                                </form>
                                <div th:if="${oturmaDuzeni.durum == 'ONAYLANDI'}" class="alert alert-success text-center mb-0">
                                    <i class="fas fa-check-circle"></i> Onaylanmış
                                </div>
                                <hr>
                                <a href="/sinav-oturma" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left"></i> Geri Dön
                                </a>
                                <a th:href="@{/sinav-oturma/delete/{id}(id=${oturmaDuzeni.id})}" class="btn btn-outline-danger"
                                   onclick="return confirm('Bu oturma düzenini silmek istediğinizden emin misiniz?')">
                                    <i class="fas fa-trash"></i> Sil
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sağ Panel -->
                <div class="col-lg-8">
                    <!-- Öğrenci Oturma Düzeni -->
                    <div class="card mb-4">
                        <div class="card-header bg-success text-white">
                            <h5><i class="fas fa-users"></i> Öğrenci Oturma Düzeni</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Pozisyon</th>
                                            <th>Öğrenci</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="entry : ${oturmaDuzeni.oturmaPozisyonlari}">
                                            <td th:text="${entry.key}"></td>
                                            <td th:text="${entry.value}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div th:if="${#lists.isEmpty(oturmaPozisyonlari.ogrenciOturmaDuzenleri)}" class="text-center py-4">
                                <i class="fas fa-users-slash fa-3x text-muted mb-3"></i>
                                <p class="text-muted">Henüz öğrenci ataması yapılmamıştır.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Oturma Pozisyonları Tablosu -->
                    <div class="card">
                        <div class="card-header bg-dark text-white">
                            <h5><i class="fas fa-table"></i> Oturma Pozisyonları</h5>
                        </div>
                        <div class="card-body">
                            <div th:if="${#maps.isEmpty(oturmaDuzeni.oturmaPozisyonlari)}" class="text-center text-muted">
                                <i class="fas fa-chair fa-2x mb-2"></i>
                                <p>Henüz oturma pozisyonları tanımlanmamış.</p>
                            </div>
                            <div th:if="${!#maps.isEmpty(oturmaDuzeni.oturmaPozisyonlari)}" class="table-responsive">
                                <table class="table table-bordered table-striped align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Pozisyon</th>
                                            <th>Öğrenci</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="entry : ${oturmaDuzeni.oturmaPozisyonlari}">
                                            <td th:text="${entry.key}"></td>
                                            <td th:text="${entry.value}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div> <!-- Sağ Panel Bitiş -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
