<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınav Oturma Düzeni Oluştur</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #007bff;
        }
        .student-selection {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
        }
        .capacity-info {
            background: #e3f2fd;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(45deg, #007bff, #0056b3);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #dee2e6;
            padding: 12px 15px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,0.25);
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <!-- Başlık -->
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="text-center mb-0">
                    <i class="fas fa-chair text-primary me-2"></i>
                    Sınav Oturma Düzeni Oluştur
                </h2>
            </div>
        </div>

        <!-- Hata/Başarı Mesajları -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Sınav Programından Oluştur Formu -->
        <div class="form-section">
            <h5 class="text-primary mb-4">
                <i class="fas fa-calendar-check me-2"></i>
                Sınav Programından Oturma Düzeni Oluştur
            </h5>
            
            <form th:action="@{/sinav-oturma/sinav-programindan-olustur}" method="post">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="sinavProgramiId" class="form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Sınav Programı
                            </label>
                            <select class="form-select" id="sinavProgramiId" name="sinavProgramiId" required onchange="loadSinavProgramDetails()">
                                <option value="">Sınav Programı Seçin</option>
                                <option th:each="sinav : ${sinavProgramlari}" 
                                        th:value="${sinav.id}" 
                                        th:text="|${sinav.ders.ders_adi} - ${sinav.tarih} ${sinav.saat}|">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div id="sinavDetayları" style="display: none;">
                            <div class="alert alert-info">
                                <h6>Sınav Detayları:</h6>
                                <p id="sinavBilgi" class="mb-0"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        <i class="fas fa-users me-1"></i>
                        Sınava Katılacak Öğrenciler
                    </label>
                    <div class="row">
                        <div class="col-md-8">
                            <div class="student-selection">
                                <div class="mb-3">
                                    <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="selectAllStudents()">
                                        <i class="fas fa-check-double me-1"></i>Tümünü Seç
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearAllStudents()">
                                        <i class="fas fa-times me-1"></i>Tümünü Temizle
                                    </button>
                                </div>
                                <div th:each="ogrenci : ${ogrenciler}" class="form-check mb-2">
                                    <input class="form-check-input student-checkbox" type="checkbox" 
                                           th:value="${ogrenci.id}" 
                                           th:id="'ogrenci-' + ${ogrenci.id}"
                                           name="ogrenciIds">
                                    <label class="form-check-label" th:for="'ogrenci-' + ${ogrenci.id}">
                                        <span th:text="|${ogrenci.ad} ${ogrenci.soyad} (${ogrenci.ogrenciNo})|"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="capacity-info">
                                <h6><i class="fas fa-info-circle text-info me-2"></i>Seçim Bilgisi</h6>
                                <p class="mb-1">Seçilen Öğrenci: <span id="selectedCount">0</span></p>
                                <p class="mb-0">Derslik Kapasitesi: <span id="classroomCapacity">-</span></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-magic me-2"></i>
                        Oturma Düzeni Oluştur
                    </button>
                </div>
            </form>
        </div>

        <!-- Geri Dön Butonu -->
        <div class="text-center mt-4">
            <a th:href="@{/sinav-oturma}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>
                Geri Dön
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sınav programı detaylarını yükle
        async function loadSinavProgramDetails() {
            const selectElement = document.getElementById('sinavProgramiId');
            const sinavId = selectElement.value;
            
            if (sinavId) {
                try {
                    const response = await fetch(`/sinav-oturma/api/sinav-programi/${sinavId}`);
                    const sinav = await response.json();
                    
                    if (sinav) {
                        document.getElementById('sinavBilgi').innerHTML = `
                            <strong>Ders:</strong> ${sinav.ders.ders_adi}<br>
                            <strong>Tarih:</strong> ${sinav.tarih}<br>
                            <strong>Saat:</strong> ${sinav.saat}<br>
                            <strong>Derslik:</strong> ${sinav.derslik.isim}<br>
                            <strong>Gözetmen:</strong> ${sinav.gozetmen.isim} ${sinav.gozetmen.soyisim}
                        `;
                        document.getElementById('sinavDetayları').style.display = 'block';
                        document.getElementById('classroomCapacity').textContent = sinav.derslik.kapasite;
                    }
                } catch (error) {
                    console.error('Sınav bilgileri yüklenirken hata:', error);
                }
            } else {
                document.getElementById('sinavDetayları').style.display = 'none';
            }
        }

        // Öğrenci seçim fonksiyonları
        function selectAllStudents() {
            document.querySelectorAll('.student-checkbox').forEach(checkbox => {
                checkbox.checked = true;
            });
            updateSelectedCount();
        }

        function clearAllStudents() {
            document.querySelectorAll('.student-checkbox').forEach(checkbox => {
                checkbox.checked = false;
            });
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const selectedCount = document.querySelectorAll('.student-checkbox:checked').length;
            document.getElementById('selectedCount').textContent = selectedCount;
        }

        // Event listener'lar
        document.addEventListener('DOMContentLoaded', function() {
            // Checkbox'lar için event listener
            document.querySelectorAll('.student-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', updateSelectedCount);
            });
            
            // Sayfa yüklendiğinde sayıları güncelle
            updateSelectedCount();
        });
    </script>
</body>
</html>
