<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sınav Oturma Düzenleri</title>
    <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
    <h1>Sınav Oturma Düzenleri</h1>

    <a href="/sinav-oturma/new">Yeni Oturma Düzeni Oluştur</a>

    <form action="/sinav-oturma/filtre" method="get">
        <select name="derslikAdi">
            <option value="">Derslik Seçiniz</option>
            <th:block th:each="derslik : ${derslikler}">
                <option th:value="${derslik.isim}" th:text="${derslik.isim}" 
                    th:selected="${derslik.isim} == ${secilenDerslik}"></option>
            </th:block>
        </select>

        <select name="durum">
            <option value="">Durum</option>
            <option value="onayli" th:selected="${secilenDurum} == 'onayli'">Onaylı</option>
            <option value="beklemede" th:selected="${secilenDurum} == 'beklemede'">Beklemede</option>
        </select>

        <button type="submit">Filtrele</button>
    </form>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Derslik</th>
                <th>Sınav Adı</th>
                <th>Sınav Tarihi</th>
                <th>Durum</th>
                <th>Detay</th>
                <th>Matris</th>
                <th>PDF</th>
                <th>Sil</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="oturma : ${sinavOturmaDuzenleri}">
                <td th:text="${oturma.id}"></td>
                <td th:text="${oturma.derslikAdi}"></td>
                <td th:text="${oturma.sinavAdi}"></td>
                <td th:text="${#dates.format(oturma.sinavTarihi, 'dd.MM.yyyy HH:mm')}"></td>
                <td th:text="${oturma.durum}"></td>
                <td><a th:href="@{/sinav-oturma/{id}(id=${oturma.id})}">Detay</a></td>
                <td><a th:href="@{/sinav-oturma/{id}/matris(id=${oturma.id})}">Matris</a></td>
                <td><a th:href="@{/sinav-oturma/{id}/pdf(id=${oturma.id})}">PDF</a></td>
                <td><a th:href="@{/sinav-oturma/delete/{id}(id=${oturma.id})}" 
                       onclick="return confirm('Silmek istediğinize emin misiniz?');">Sil</a></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
