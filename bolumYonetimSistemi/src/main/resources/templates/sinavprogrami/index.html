<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sınav Programı</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="container mt-4">

    <div class="login-card" style="max-width: 1000px;">
        <div class="login-card-header bg-dark text-white">
            <h2><i class="fas fa-calendar-alt"></i> Sınav Programı Listesi</h2>
        </div>

        <div class="login-card-body">
            <p th:if="${hataMesaji}" class="alert alert-danger" th:text="${hataMesaji}"></p>

            <div class="table-responsive mb-5">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Ders</th>
                            <th>Derslik</th>
                            <th>Gözetmen</th>
                            <th>Tarih</th>
                            <th>Saat</th>
                            <th>Not</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sinav : ${sinavlar}">
                            <td th:text="${sinav.ders.ders_adi}">Ders</td>
                            <td th:text="${sinav.derslik.isim}">Derslik</td>
                            <td th:text="${sinav.gozetmen.unvan + ' ' + sinav.gozetmen.isim + ' ' + sinav.gozetmen.soyisim}">Gözetmen</td>
                            <td th:text="${sinav.tarih}">Tarih</td>
                            <td th:text="${sinav.saat}">Saat</td>
                            <td th:text="${sinav.notlar} ?: 'Henüz girilmedi'">Not</td>
                            <td>
                                <a th:href="@{'/sinavprogrami/sil/' + ${sinav.id}}" class="btn btn-sm btn-outline-danger" title="Sil"
                                   onclick="return confirm('Bu sınavı silmek istediğinize emin misiniz?')">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <h4 class="mb-3"><i class="fas fa-plus-circle"></i> Yeni Sınav Ekle</h4>

            <form th:action="@{/sinavprogrami/kaydet}" th:object="${sinavProgrami}" method="post" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Ders:</label>
                    <select th:field="*{ders}" class="form-select" required>
                        <option value="" disabled selected>Ders seçiniz</option>
                        <option th:each="ders : ${dersler}" th:value="${ders}" th:text="${ders.ders_adi}">Ders</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Derslik:</label>
                    <select th:field="*{derslik}" class="form-select" required>
                        <option value="" disabled selected>Derslik seçiniz</option>
                        <option th:each="d : ${derslikler}" th:value="${d}" th:text="${d.isim}">Derslik</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Gözetmen:</label>
                    <select th:field="*{gozetmen}" class="form-select" required>
                        <option value="" disabled selected>Gözetmen seçiniz</option>
                        <option th:each="o : ${ogretimUyeleri}" th:value="${o}" th:text="${o.unvan + ' ' + o.isim + ' ' + o.soyisim}">Gözetmen</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Tarih:</label>
                    <input type="date" th:field="*{tarih}" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Saat:</label>
                    <input type="time" th:field="*{saat}" class="form-control" required>
                </div>

                <div class="col-12 text-end mt-3">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Sınavı Kaydet
                    </button>
                </div>
            </form>
        </div>




    </div>

</body>
</html>
