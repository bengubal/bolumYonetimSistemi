<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sınav Programım</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="container mt-4">

    <div class="login-card" style="max-width: 1100px;">
        <div class="login-card-header bg-primary text-white">
            <h2><i class="fas fa-calendar-check"></i> Sınav Programınız</h2>
        </div>

        <div class="login-card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Ders</th>
                            <th>Derslik</th>
                            <th>Tarih</th>
                            <th>Saat</th>
                            <th>Notlar</th>
                            <th>Not Ekle / Güncelle</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sinav : ${sinavlar}">
                            <td th:text="${sinav.ders.ders_adi}">Ders Adı</td>
                            <td th:text="${sinav.derslik.isim}">Derslik</td>
                            <td th:text="${sinav.tarih}">Tarih</td>
                            <td th:text="${sinav.saat}">Saat</td>
                            <td th:text="${sinav.notlar} ?: 'Henüz girilmedi'">Henüz girilmedi</td>
                            <td>
                                <form th:action="@{/ogretimelemani/sinavprogrami/notEkle}" method="post" class="d-flex gap-2">
                                    <input type="hidden" name="sinavId" th:value="${sinav.id}" />
                                    <input type="text" name="notlar" th:value="${sinav.notlar}" class="form-control" placeholder="Not giriniz..." />
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-save"></i> Kaydet
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="text-center mt-4">
                <a href="/logout" class="btn btn-outline-danger">
                    <i class="fas fa-sign-out-alt"></i> Çıkış Yap
                </a>
            </div>
        </div>
    </div>

</body>
</html>
