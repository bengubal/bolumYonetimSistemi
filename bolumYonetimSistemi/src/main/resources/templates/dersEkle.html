<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ders Programı Ekle</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Ders Programı Ekle</h1>
        <form th:action="@{/dersProgrami/dersEkle}" th:object="${dersProgrami}" method="post">

                <label for="gun">Gün</label>
                <input type="text" class="form-control" id="gun" th:field="*{gun}" placeholder="Gün" required>
            </div>
            <div class="form-group">
                <label for="ders">Ders</label>
                <input type="text" class="form-control" id="ders" th:field="*{ders.ders_adi}" placeholder="Ders Adı" required>
            </div>
            <div class="form-group">

                <input type="text" class="form-control" id="ogretimUyesi" th:field="*{ogretimUyesi.isim}" placeholder="Öğretim Üyesi" required>
            </div>
            <div class="form-group">
                <label for="derslik">Derslik</label>
                <input type="text" class="form-control" id="derslik" th:field="*{derslik.isim}" placeholder="Derslik" required>
            </div>
