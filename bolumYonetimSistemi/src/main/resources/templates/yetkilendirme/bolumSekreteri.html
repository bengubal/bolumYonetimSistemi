<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bölüm Sekreteri Paneli</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-container">

<div class="login-card" style="max-width: 600px;">
    <div class="login-card-header">
        <h2>Bölüm Sekreteri Paneli</h2>
        <p class="subtitle">İşlemler aşağıdaki menülerden seçilebilir</p>
    </div>

    <div class="login-card-body text-center">
        <p class="fw-bold mb-4">👋 Hoş Geldiniz, <span th:text="${session.user.username}"></span></p>

        <div class="d-grid gap-2">
            <a href="/ders_derslik/dersler" class="btn btn-secondary">
                <i class="fas fa-book"></i> Ders Yönetimi
            </a>
            <a href="/web/dersProgrami" class="btn btn-warning">
                <i class="fas fa-calendar-alt"></i> Ders Programı
            </a>
            <a href="/web/dersProgrami/yeni" class="btn btn-success">
                <i class="fas fa-edit"></i> Ders Programı Yönetimi
            </a>
            <a href="/sinavprogrami" class="btn btn-dark">
                <i class="fas fa-file-alt"></i> Sınav Programı Yönetimi
            </a>
            <a href="/logout" class="btn btn-danger">
                <i class="fas fa-sign-out-alt"></i> Çıkış Yap
            </a>
        </div>
    </div>

    <div class="login-footer">
        © 2025 Sekreter Paneli
    </div>
</div>

</body>
</html>
