<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Giriş Seçimi</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-container">

    <div class="login-card">
        <div class="login-card-header">
            <h2>🏛️ Bölüm İşleri Yazılımı</h2>
            <p class="subtitle">Lütfen giriş türünüzü seçin</p>
        </div>

        <div class="login-card-body text-center">

            <div th:if="${session.user == null}">
                <a href="/idariGiris" class="btn btn-primary w-100 mb-3">
                    <i class="fas fa-user-shield"></i> İdari Giriş
                </a>
                <a href="/akademikGiris" class="btn btn-secondary w-100">
                    <i class="fas fa-user-graduate"></i> Akademik Giriş
                </a>
            </div>

            <div th:if="${session.user != null}">
                <p class="mt-3 fw-bold" th:text="'Hoş geldiniz, ' + ${session.user.username}"></p>
                <a href="/logout" class="btn btn-danger w-100 mt-2">
                    <i class="fas fa-sign-out-alt"></i> Çıkış Yap
                </a>
            </div>
        </div>

        <div class="login-footer">
            © 2025 Bölüm Yönetim Sistemi
        </div>
    </div>

</body>
</html>
