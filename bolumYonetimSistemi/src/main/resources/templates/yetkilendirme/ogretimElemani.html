<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Öğretim Elemanı Paneli</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-container">

<div class="login-card" style="max-width: 600px;">
    <div class="login-card-header">
        <h2>Öğretim Elemanı Paneli</h2>
        <p class="subtitle">Program bilgilerinize buradan ulaşabilirsiniz</p>
    </div>

    <div class="login-card-body text-center">
        <p class="fw-bold mb-4">👨‍🏫 Hoş Geldiniz, <span th:text="${session.user.username}"></span></p>

        <div class="d-grid gap-2">
            <a href="/ogretimelemani/kapiIsimligi" class="btn btn-secondary">
                <i class="fas fa-door-open"></i> Ders Programı ve Kapı İsimliği
            </a>
            <a href="/ogretimelemani/sinavprogrami" class="btn btn-info">
                <i class="fas fa-file-alt"></i> Sınav Programı
            </a>
            <a href="/logout" class="btn btn-danger">
                <i class="fas fa-sign-out-alt"></i> Çıkış Yap
            </a>
        </div>
    </div>

    <div class="login-footer">
        © 2025 Bölüm Yönetim Sistemi
    </div>
</div>

</body>
</html>
