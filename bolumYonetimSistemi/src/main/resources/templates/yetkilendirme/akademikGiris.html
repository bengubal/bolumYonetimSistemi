<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akademik Giriş</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-container">
    <div class="login-card">
        <div class="login-card-header">
            <h2><i class="fas fa-graduation-cap"></i> Akademik Giriş</h2>
            <p class="subtitle">Sisteme giriş yapmak için bilgilerinizi giriniz</p>
        </div>
        <div class="login-card-body">
            <form th:action="@{/akademikLogin}" method="post" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> Kullanıcı Adı
                    </label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Şifre
                    </label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>



                <button type="submit" class="btn login-btn">
                    <i class="fas fa-sign-in-alt"></i> Giriş Yap
                </button>

                <div th:if="${error}" class="login-error">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span th:text="${error}"></span>
                </div>
            </form>
                    <div class="login-footer">
            © 2025 Bölüm Yönetim Sistemi
        </div>
        </div>
    </div>
</body>
</html>
