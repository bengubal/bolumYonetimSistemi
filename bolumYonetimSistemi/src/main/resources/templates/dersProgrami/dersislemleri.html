<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ders ve Derslik İşlemleri</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Ders İşlemleri</h2>

    <!-- Ders Listesi -->
    <div class="mb-3">
        <a href="/ders_derslik/ders/new" class="btn btn-success mb-2">Yeni Ders Ekle</a>
        <table class="table table-bordered table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Ders Adı</th>
                <th>İşlemler</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ders : ${dersler}">
                <td th:text="${ders.id}"></td>
                <td th:text="${ders.ders_adi}"></td>
                <td>
                    <a th:href="@{/ders_derslik/ders/{id}(id=${ders.id})}" class="btn btn-primary btn-sm">Güncelle</a>
                    <a th:href="@{/ders_derslik/ders/delete/{id}(id=${ders.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Dersi silmek istediğinize emin misiniz?')">Sil</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Ders Ekleme/Güncelleme Formu -->
    <div th:if="${ders != null}">
        <h4 th:text="${#strings.isEmpty(ders.id) ? 'Yeni Ders Ekle' : 'Dersi Güncelle'}"></h4>
        <form th:action="@{/ders_derslik/ders/save}" th:object="${ders}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label for="ad" class="form-label">Ders Adı</label>
                <input type="text" id="ad" th:field="*{ders_adi}" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-primary">Kaydet</button>
        </form>
    </div>

    <hr class="my-5">

    <h2 class="mb-4">Derslik İşlemleri</h2>

    <!-- Derslik Listesi -->
    <div class="mb-3">
        <a href="/ders_derslik/derslik/new" class="btn btn-success mb-2">Yeni Derslik Ekle</a>
        <table class="table table-bordered table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Derslik Adı</th>
                <th>İşlemler</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="derslik : ${derslikler}">
                <td th:text="${derslik.id}"></td>
                <td th:text="${derslik.isim}"></td>
                <td>
                    <a th:href="@{/ders_derslik/derslik/{id}(id=${derslik.id})}" class="btn btn-primary btn-sm">Güncelle</a>
                    <a th:href="@{/ders_derslik/derslik/delete/{id}(id=${derslik.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Dersliği silmek istediğinize emin misiniz?')">Sil</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Derslik Ekleme/Güncelleme Formu -->
    <div th:if="${derslik != null}">
        <h4 th:text="${#strings.isEmpty(derslik.id) ? 'Yeni Derslik Ekle' : 'Dersliği Güncelle'}"></h4>
        <form th:action="@{/ders_derslik/derslik/save}" th:object="${derslik}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label for="ad" class="form-label">Derslik Adı</label>
                <input type="text" id="ad" th:field="*{isim}" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-primary">Kaydet</button>
        </form>
    </div>
</div>
</body>
</html>
