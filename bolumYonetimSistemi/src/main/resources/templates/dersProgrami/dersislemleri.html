<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ders İşlemleri</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center mb-4">
        <i class="fas fa-book-open text-primary me-2"></i>
        Ders İşlemleri
    </h2>

    <!-- Ders Listesi -->
    <div class="card mb-4">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <span><i class="fas fa-list"></i> Mevcut Dersler</span>
            <a href="/ders_derslik/ders/new" class="btn btn-light btn-sm"><i class="fas fa-plus"></i> Yeni Ders Ekle</a>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Ders Kodu</th>
                    <th>Ders Adı</th>
                    <th>AKTS</th>
                    <th>Kredi</th>
                    <th>Kontenjan</th>
                    <th>İşlemler</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ders : ${dersler}">
                    <td th:text="${ders.id}"></td>
                    <td th:text="${ders.ders_kodu}"></td>
                    <td th:text="${ders.ders_adi}"></td>
                    <td th:text="${ders.akts}"></td>
                    <td th:text="${ders.kredi}"></td>
                    <td th:text="${ders.kontenjan}"></td>
                    <td>
                        <a th:href="@{/ders_derslik/ders/{id}(id=${ders.id})}" class="btn btn-sm btn-primary me-2">
                            <i class="fas fa-edit"></i> Güncelle
                        </a>
                        <a th:href="@{/ders_derslik/ders/delete/{id}(id=${ders.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Dersi silmek istediğinize emin misiniz?')">
                            <i class="fas fa-trash"></i> Sil
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Ders Ekleme/Güncelleme Formu -->
    <div th:if="${ders != null}" class="card">
        <div class="card-header bg-info text-white">
            <i class="fas fa-pen"></i>
            <span th:text="${#strings.isEmpty(ders.id) ? 'Yeni Ders Ekle' : 'Dersi Güncelle'}"></span>
        </div>
        <div class="card-body">
            <form th:action="@{/ders_derslik/ders/save}" th:object="${ders}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ders Kodu</label>
                        <input type="text" th:field="*{ders_kodu}" class="form-control" required/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ders Adı</label>
                        <input type="text" th:field="*{ders_adi}" class="form-control" required/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">AKTS</label>
                        <input type="number" th:field="*{akts}" class="form-control" required min="1"/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Kredi</label>
                        <input type="number" th:field="*{kredi}" class="form-control" required min="1"/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Kontenjan</label>
                        <input type="number" th:field="*{kontenjan}" class="form-control" required min="1"/>
                    </div>
                </div>
                <div class="text-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Kaydet
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
