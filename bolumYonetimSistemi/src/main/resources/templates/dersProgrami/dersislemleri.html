<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ders İşlemleri</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Ders İşlemleri</h2>

    <!-- Ders Listesi -->
    <div class="mb-3">
        <a href="/ders_derslik/ders/new" class="btn btn-success mb-2">Yeni Ders Ekle</a>
        <table class="table table-bordered table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Ders Kodu</th>
                <th>Ders Adı</th>
                <th>AKTS</th>
                <th>Kredi</th>
                <th>Kontenjan</th>
                <th>İşlemler</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ders : ${dersler}">
                <td th:text="${ders.id}"></td>
                <td th:text="${ders.ders_kodu}"></td>
                <td th:text="${ders.ders_adi}"></td>
                <td th:text="${ders.akts}"></td>
                <td th:text="${ders.kredi}"></td>
                <td th:text="${ders.kontenjan}"></td>
                <td>
                    <a th:href="@{/ders_derslik/ders/{id}(id=${ders.id})}" class="btn btn-primary btn-sm">Güncelle</a>
                    <a th:href="@{/ders_derslik/ders/delete/{id}(id=${ders.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Dersi silmek istediğinize emin misiniz?')">Sil</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Ders Ekleme/Güncelleme Formu -->
    <div th:if="${ders != null}">
        <h4 th:text="${#strings.isEmpty(ders.id) ? 'Yeni Ders Ekle' : 'Dersi Güncelle'}"></h4>
        <form th:action="@{/ders_derslik/ders/save}" th:object="${ders}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label class="form-label">Ders Kodu</label>
                <input type="text" th:field="*{ders_kodu}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Ders Adı</label>
                <input type="text" th:field="*{ders_adi}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">AKTS</label>
                <input type="number" th:field="*{akts}" class="form-control" required min="1"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Kredi</label>
                <input type="number" th:field="*{kredi}" class="form-control" required min="1"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Kontenjan</label>
                <input type="number" th:field="*{kontenjan}" class="form-control" required min="1"/>
            </div>
            <button type="submit" class="btn btn-primary">Kaydet</button>
        </form>
    </div>
</div>
</body>
</html>
