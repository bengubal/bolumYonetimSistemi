<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ders İşlemleri</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .grid-cell { width: 20px; height: 20px; border: 1px solid #e0e0e0; display: inline-block; margin: 1px; cursor: pointer; background-color: #fff; transition: all 0.2s ease; }
        .grid-cell:hover { background-color: #007bff; border-color: #0056b3; }
        .grid-cell.selected { background-color: #007bff; border-color: #0056b3; }
        .grid-cell.preview { background-color: #bee5eb; border-color: #17a2b8; }
        .grid-row { display: block; height: 22px; line-height: 22px; }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center mb-4">
        <i class="fas fa-door-open text-primary me-2"></i>
        Derslik İşlemleri
    </h2>

    <div class="card mb-4">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <span><i class="fas fa-list"></i> Mevcut Derslikler</span>
            <a th:href="@{/ders_derslik/derslik/new}" class="btn btn-light btn-sm"><i class="fas fa-plus"></i> Yeni Derslik Ekle</a>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Derslik Adı</th>
                    <th>Boyut</th>
                    <th>İşlemler</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="derslik : ${derslikler}">
                    <td th:text="${derslik.id}">1</td>
                    <td th:text="${derslik.isim}">Derslik A</td>
                    <td>
                        <span th:if="${derslik.genislik != null and derslik.yukseklik != null}"
                              th:text="${derslik.genislik + ' x ' + derslik.yukseklik}"></span>
                        <span th:unless="${derslik.genislik != null and derslik.yukseklik != null}" class="text-muted">Boyut belirtilmemiş</span>
                    </td>
                    <td>
                        <a th:href="@{/ders_derslik/derslik/{id}(id=${derslik.id})}" class="btn btn-sm btn-primary me-2">
                            <i class="fas fa-edit"></i> Güncelle
                        </a>
                        <a th:href="@{/ders_derslik/derslik/delete/{id}(id=${derslik.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Dersliği silmek istediğinize emin misiniz?')">
                            <i class="fas fa-trash"></i> Sil
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${derslik != null}" class="card">
        <div class="card-header bg-info text-white">
            <i class="fas fa-pen"></i>
            <span th:text="${derslik.id == null ? 'Yeni Derslik Ekle' : 'Dersliği Güncelle'}"></span>
        </div>
        <div class="card-body">
            <form th:action="@{/ders_derslik/derslik/save}" th:object="${derslik}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label for="derslik-ad" class="form-label">Derslik Adı</label>
                    <input type="text" id="derslik-ad" th:field="*{isim}" class="form-control" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Derslik Boyutu Seçin</label>
                    <div class="border rounded p-3 bg-light">
                        <div class="mb-2 fw-bold text-primary" id="sizeDisplay">Boyut: 1 x 1</div>
                        <div class="border rounded bg-white p-2" id="gridContainer"></div>
                        <small class="text-muted d-block mt-2">Fare ile karelerin üzerine gelerek boyut seçin.</small>
                    </div>
                </div>

                <input type="hidden" id="genislik" th:field="*{genislik}"/>
                <input type="hidden" id="yukseklik" th:field="*{yukseklik}"/>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Kaydet
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const gridContainer = document.getElementById('gridContainer');
    const sizeDisplay = document.getElementById('sizeDisplay');
    const genislikInput = document.getElementById('genislik');
    const yukseklikInput = document.getElementById('yukseklik');

    const maxCols = 15, maxRows = 12;
    let selectedWidth = parseInt(genislikInput.value) || 1;
    let selectedHeight = parseInt(yukseklikInput.value) || 1;

    function createGrid() {
        gridContainer.innerHTML = '';
        for (let row = 1; row <= maxRows; row++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'grid-row';
            for (let col = 1; col <= maxCols; col++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.dataset.row = row;
                cell.dataset.col = col;

                if (col <= selectedWidth && row <= selectedHeight) cell.classList.add('selected');
                cell.addEventListener('mouseenter', () => highlightPreview(col, row));
                cell.addEventListener('click', () => selectSize(col, row));
                rowDiv.appendChild(cell);
            }
            gridContainer.appendChild(rowDiv);
        }

        gridContainer.addEventListener('mouseleave', () => {
            clearPreview();
            showSelected();
        });
    }

    function highlightPreview(width, height) {
        document.querySelectorAll('.grid-cell').forEach(cell => {
            const col = parseInt(cell.dataset.col), row = parseInt(cell.dataset.row);
            cell.classList.remove('preview', 'selected');
            if (col <= width && row <= height) cell.classList.add('preview');
        });
        sizeDisplay.textContent = `Boyut: ${width} x ${height}`;
    }

    function selectSize(width, height) {
        selectedWidth = width;
        selectedHeight = height;
        genislikInput.value = width;
        yukseklikInput.value = height;
        showSelected();
    }

    function showSelected() {
        document.querySelectorAll('.grid-cell').forEach(cell => {
            const col = parseInt(cell.dataset.col), row = parseInt(cell.dataset.row);
            cell.classList.remove('preview', 'selected');
            if (col <= selectedWidth && row <= selectedHeight) cell.classList.add('selected');
        });
        sizeDisplay.textContent = `Boyut: ${selectedWidth} x ${selectedHeight}`;
    }

    function clearPreview() {
        document.querySelectorAll('.grid-cell').forEach(cell => cell.classList.remove('preview'));
    }

    createGrid();
    showSelected();
});
</script>
</body>
</html>
