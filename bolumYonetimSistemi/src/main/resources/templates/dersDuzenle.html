<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ders Programı Düzenle</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Ders Programı Düzenle</h1>
        <form th:action="@{/dersProgrami/{id}(id=${dersProgrami.id})}" th:object="${dersProgrami}" method="post">
            <div class="form-group">
                <label for="gun">Gün</label>
                <input type="text" class="form-control" id="gun" th:field="*{gun}" placeholder="Gün" required>
            </div>
            <div class="form-group">
                <label for="ders">Ders</label>
                <input type="text" class="form-control" id="ders" th:field="*{ders.dersAdi}" placeholder="Ders Adı" required>
            </div>
            <div class="form-group">
                <label for="ogretimUyesi">Öğretim Üyesi</label>
                <input type="text" class="form-control" id="ogretimUyesi" th:field="*{ogretimUyesi.isim}" placeholder="Öğretim Üyesi" required>
            </div>
            <div class="form-group">
                <label for="derslik">Derslik</label>
                <input type="text" class="form-control" id="derslik" th:field="*{derslik.isim}" placeholder="Derslik" required>
            </div>
            <div class="form-group">
                <label for="baslangicSaati">Başlangıç Saati</label>
                <input type="time" class="form-control" id="baslangicSaati" th:field="*{baslangicSaati}" required>
            </div>
            <div class="form-group">
                <label for="bitisSaati">Bitiş Saati</label>
                <input type="time" class="form-control" id="bitisSaati" th:field="*{bitisSaati}" required>
            </div>
            <button type="submit" class="btn btn-primary">Güncelle</button>
        </form>
    </div>
</body>
</html>
